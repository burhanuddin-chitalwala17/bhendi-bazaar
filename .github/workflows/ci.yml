name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# One run per branch. PR runs are superseded freely; a push run is never
# cancelled — it may be mid `prisma migrate deploy`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      # Blocking gates — never add `continue-on-error` here (docs/TESTING.md).
      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

  # PR-only: pushes get their build from `vercel build` in the deploy job, so
  # building twice on the same commit would just burn minutes.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test

    # `next build` prerenders robots.txt and the sitemap, which reach appUrl()
    # and the catalogue — an unreachable connection string turns a compile check
    # into a prerender crash on code that is fine in production. A throwaway
    # Postgres makes this a real rehearsal of the deploy build.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhendi_bazaar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bhendi_bazaar_ci"
      # Placeholders. This artifact is discarded — deploys build with
      # `vercel build` against the environment `vercel pull` fetched — so these
      # only have to be present and well-formed. Never real credentials: a
      # NEXT_PUBLIC_* value is inlined into the client bundle.
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-build-placeholder-not-a-real-secret"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

  # Vercel Hobby only git-deploys commits authored by the account owner, so a
  # collaborator's push never shipped. Deploying through the CLI with an account
  # token makes authorship irrelevant. Git-triggered deploys are switched off in
  # vercel.json so this is the only path to a deployment.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Resolve deployment target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Builds on Vercel, not here. The tempting alternative — `vercel pull` +
      # `vercel build` + `deploy --prebuilt`, to spend GitHub's minutes instead
      # of Vercel's — cannot work: DATABASE_URL and MIGRATE_DATABASE_URL are
      # Sensitive variables, which are write-only. `vercel pull` substitutes
      # "[SENSITIVE]" for them, so the `prisma migrate deploy` in vercel.json's
      # buildCommand would run against a placeholder and fail. Building remotely
      # is also what the Git integration always did, so nothing else shifts.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy ${{ steps.target.outputs.prod_flag }} \
            --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A preview is only testable if its URL is stable: OAuth redirect URIs and
      # webhook endpoints have to be registered in advance, and a per-deployment
      # URL never can be. `main` needs no alias — `--prod` assigns the production
      # domains itself.
      - name: Point the preview domain at this deployment
        if: github.ref_name == 'develop'
        run: >
          vercel alias set "${{ steps.deploy.outputs.url }}"
          dev.bhendi-bazaar.com
          --token="$VERCEL_TOKEN"

      - name: Summary
        run: |
          {
            echo "### Deployed to ${{ steps.target.outputs.environment }}"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            if [ "${{ github.ref_name }}" = "develop" ]; then
              echo "- Stable preview: https://dev.bhendi-bazaar.com"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
