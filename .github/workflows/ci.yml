name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# One run per branch. PR runs are superseded freely; a push run is never
# cancelled — it may be mid `prisma migrate deploy`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      # Blocking gates — never add `continue-on-error` here (docs/TESTING.md).
      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

  # PR-only: pushes get their build from `vercel build` in the deploy job, so
  # building twice on the same commit would just burn minutes.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  # Vercel Hobby only git-deploys commits authored by the account owner, so a
  # collaborator's push never shipped. Deploying through the CLI with an account
  # token makes authorship irrelevant. Git-triggered deploys are switched off in
  # vercel.json so this is the only path to a deployment.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Resolve deployment target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Brings the target environment's variables down as .vercel/.env.*.local,
      # which is where `vercel build` reads DATABASE_URL / MIGRATE_DATABASE_URL
      # for the `prisma migrate deploy` in vercel.json's buildCommand.
      - name: Pull Vercel environment
        run: >
          vercel pull --yes
          --environment=${{ steps.target.outputs.environment }}
          --git-branch=${{ github.ref_name }}
          --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} \
            --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Deployed to ${{ steps.target.outputs.environment }}"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
