name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# One run per branch. PR runs are superseded freely; a push run is never
# cancelled — it may be mid `prisma migrate deploy`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job asks for more (deploy-worker writes packages).
permissions:
  contents: read

jobs:
  # Only finished work merges to main (ADR-0084). PRs into main only: a feature branch carries its plans.
  main-ready:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      # Node built-ins only, so no npm ci.
      - name: Main holds only finished work
        run: npm run check:main-ready

  # Every gate below starts at once and `deploy` waits for all of them. They used to run as one
  # chain (test → e2e → deploy → worker build), which made a push take 30–38 minutes.
  test:
    runs-on: ubuntu-latest

    # No database here: prisma.config.ts refuses to load without a URL, and nothing connects.
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bhendi_bazaar_ci"

    # Kept so the check is still reported as `test (22.x)`, the name branch protection knows.
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking: a high or critical advisory in what ships stops the deploy (docs/GTM-READINESS.md B1),
      # unless audit-allowlist.json names it with a reason and an expiry. Dev-only tooling is excluded.
      - name: Audit production dependencies
        run: node scripts/audit-prod.mjs

      # Advisory: 55 `no-explicit-any` remain in admin pages, hooks and the shipping provider
      # layer. The flag comes off when they do (docs/TESTING.md).
      - name: Run linter
        run: npm run lint
        continue-on-error: true

      # Blocking, and scoped to the trees that are already clean. `any` is a defect at a trust
      # boundary (CLAUDE.md), route handlers reached zero in PR-128, and a rule that only holds
      # until someone adds one line is not a rule. The scope grows as trees are cleared; it
      # never shrinks.
      - name: Lint the trust boundary
        run: npm run lint:boundary

      # Blocking gates — never add `continue-on-error` here (docs/TESTING.md).
      - name: Run type check
        run: npx tsc --noEmit

  # Everything outside tests/integration/ touches no database, so its files run in parallel:
  # about 2 minutes instead of the 8 the whole suite took serially.
  unit:
    runs-on: ubuntu-latest

    env:
      # Not connected to: test-integrity checks in CI that this names a disposable database.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bhendi_bazaar_ci"

    steps:
      # Full history: tests/unit/docs-integrity.test.ts decides whether a doc's
      # `Verified:` date predates the last structural change to the code it covers,
      # which a depth-1 checkout cannot answer.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The worker image carries ffmpeg (ADR-0039); the transcode test runs against the real
      # binary and refuses to skip here, so the job installs it rather than the test guessing.
      - name: Install ffmpeg for the transcode test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run unit tests
        run: npm run test:unit

  # tests/integration/ shares one database, so its files stay serial (vitest.config.ts).
  integration:
    runs-on: ubuntu-latest

    # A throwaway Postgres so the query-budget suite can run. Every SQL statement is a
    # billed operation on Prisma Postgres, and tests/integration/db-ops-budget.test.ts is
    # the only thing that catches a regression in how many a page costs — it was
    # local-only until 2026-09-24, which meant it caught them only by luck.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhendi_bazaar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bhendi_bazaar_ci"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The budget suite needs the schema; the seed deliberately cannot run here
      # (Invariant 7), and does not need to — every budget is structural.
      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:integration

  # Pushes the worker image as `:<sha>` alongside the gates, for arm64 and amd64 (worker-foundation
  # trd D7). Nothing runs it from here; `deploy-worker` moves the branch tag once the gates pass.
  worker-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bhendi-bazaar-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the cached apt layer runs emulated; npm installs natively (infra/worker/Dockerfile).
      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry cache: the Actions cache (10 GB cap) evicted the 1 GB layers and took 6 min to
      # export. Detail in docs/OPERATIONS.md.
      - name: Build and push the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/worker/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: WORKER_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # A pull only, so the restart after `deploy` skips 1 GB; the running worker is untouched.
      - name: Pre-pull the image on the production machine
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 5
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          WORKER_SSH_USER: ${{ secrets.WORKER_SSH_USER }}
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKER_HOST" || exit 0
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/worker' EXIT
          printf '%s\n' "$WORKER_SSH_KEY" > ~/.ssh/worker
          chmod 600 ~/.ssh/worker
          # The token goes over stdin, never into the remote command line.
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -i ~/.ssh/worker -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 -o BatchMode=yes "$WORKER_SSH_USER@$WORKER_HOST" \
            "docker login ghcr.io -u '$GHCR_PULL_USER' --password-stdin && docker pull -q '${IMAGE}:${{ github.sha }}'"

  # Builds the app, starts it, and walks the journeys a broken deploy breaks first (e2e/,
  # docs/GTM-READINESS.md B8). On every event: `deploy` needs it, so nothing ships to customers
  # until a real browser has browsed, opened a product and filled a cart on this commit.
  # It runs against a build made here, not the Vercel build that ships: a break only in the Vercel
  # environment (a missing variable, the real image host) is not caught. Smoke on the preview
  # URL is the follow-up, once a protection-bypass secret exists.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `next build` prerenders robots.txt and the sitemap, which reach appUrl()
    # and the catalogue — an unreachable connection string turns a compile check
    # into a prerender crash on code that is fine in production. A throwaway
    # Postgres makes this a real rehearsal of the deploy build.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhendi_bazaar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bhendi_bazaar_ci"
      # Placeholders. This artifact is discarded — deploys build with
      # `vercel build` against the environment `vercel pull` fetched — so these
      # only have to be present and well-formed. Never real credentials: a
      # NEXT_PUBLIC_* value is inlined into the client bundle.
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      NEXTAUTH_URL: "http://localhost:3100"
      NEXTAUTH_SECRET: "ci-build-placeholder-not-a-real-secret"
      APP_ENV: "local"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      # Next's compile cache, reused only for the exact same code and schema. No fallback key: `.next/cache`
      # also holds Next's stored page data, and an older cache restored onto new code served the category
      # page from data built for the old schema, so the journeys could not find the product they had just
      # seeded (twice, 2026-11; both times fixed only by deleting the cache). A miss costs a full build, and
      # the next step drops the data half of a hit, which was the stale part.
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'server/**', 'prisma/**', 'next.config.*') }}

      # The compile cache is kept; the data cache is not. `fetch-cache` holds the category page's product
      # list from the run that wrote it, against that run's database, and an exact key hit (a docs- or
      # CI-only commit) restored it onto this run's freshly seeded one (PR #86, 2026-11-21).
      - name: Drop the restored data cache
        run: rm -rf .next/cache/fetch-cache

      - name: Build application
        run: npm run build

      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the journeys
        run: npx playwright test

      # Kept on success too: a test that failed once and passed on retry is flaky, and its trace
      # is the only evidence.
      - name: Keep the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Vercel Hobby only git-deploys commits authored by the account owner, so a
  # collaborator's push never shipped. Deploying through the CLI with an account
  # token makes authorship irrelevant. Git-triggered deploys are switched off in
  # vercel.json so this is the only path to a deployment.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, unit, integration, e2e]

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Resolve deployment target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      # Builds on Vercel, not here. The tempting alternative — `vercel pull` +
      # `vercel build` + `deploy --prebuilt`, to spend GitHub's minutes instead
      # of Vercel's — cannot work: DATABASE_URL and MIGRATE_DATABASE_URL are
      # Sensitive variables, which are write-only. `vercel pull` substitutes
      # "[SENSITIVE]" for them, so the `prisma migrate deploy` in vercel.json's
      # buildCommand would run against a placeholder and fail. Building remotely
      # is also what the Git integration always did, so nothing else shifts.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy ${{ steps.target.outputs.prod_flag }} \
            --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A preview is only testable if its URL is stable: OAuth redirect URIs and
      # webhook endpoints have to be registered in advance, and a per-deployment
      # URL never can be. `main` needs no alias — `--prod` assigns the production
      # domains itself.
      - name: Point the preview domain at this deployment
        if: github.ref_name == 'develop'
        run: >
          vercel alias set "${{ steps.deploy.outputs.url }}"
          dev.bhendi-bazaar.com
          --token="$VERCEL_TOKEN"

      - name: Summary
        run: |
          {
            echo "### Deployed to ${{ steps.target.outputs.environment }}"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            if [ "${{ github.ref_name }}" = "develop" ]; then
              echo "- Stable preview: https://dev.bhendi-bazaar.com"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Starts the worker on its machine from the image `worker-image` already pushed (worker-foundation
  # trd D7). The machine is reached over SSH with a key that lives in this repository's secrets; the
  # env file the worker reads is written from secrets on each deploy and never lives in git or in
  # the image: one secret per variable, `WORKER_ENV_<NAME>`, over the optional base `WORKER_ENV_FILE`
  # (infra/worker/compose-env.sh). After `deploy`, whose build runs `prisma migrate deploy`: a
  # worker started first would run new code against the old schema (docs/GTM-READINESS.md B8).
  deploy-worker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [worker-image, deploy]
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bhendi-bazaar-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The branch tag is what a staging worker is started from, so it moves only once this commit
      # has passed every gate. A manifest copy: no layer is downloaded or rebuilt.
      - name: Point the branch tag at this commit's image
        run: docker buildx imagetools create --tag "$IMAGE:${{ github.ref_name }}" "$IMAGE:${{ github.sha }}"

      # Production only. The staging worker is started by hand while someone is testing
      # (spec R6), from the `develop` tag this job has just pushed.
      - name: Start the production worker on its machine
        if: github.ref_name == 'main'
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          WORKER_SSH_USER: ${{ secrets.WORKER_SSH_USER }}
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          BASE_ENV_FILE: ${{ secrets.WORKER_ENV_FILE }}
          # Named, never `toJSON(secrets)`: this step must not see the Vercel token or anything else.
          # Every variable the worker reads is listed; a new one is added here too.
          WORKER_ENV_DATABASE_URL: ${{ secrets.WORKER_ENV_DATABASE_URL }}
          WORKER_ENV_APP_ENV: ${{ secrets.WORKER_ENV_APP_ENV }}
          WORKER_ENV_R2_ENDPOINT: ${{ secrets.WORKER_ENV_R2_ENDPOINT }}
          WORKER_ENV_R2_BUCKET: ${{ secrets.WORKER_ENV_R2_BUCKET }}
          WORKER_ENV_R2_ACCESS_KEY_ID: ${{ secrets.WORKER_ENV_R2_ACCESS_KEY_ID }}
          WORKER_ENV_R2_SECRET_ACCESS_KEY: ${{ secrets.WORKER_ENV_R2_SECRET_ACCESS_KEY }}
          WORKER_ENV_R2_PUBLIC_BASE_URL: ${{ secrets.WORKER_ENV_R2_PUBLIC_BASE_URL }}
          WORKER_ENV_IMAGE_SEGMENT_PROVIDER: ${{ secrets.WORKER_ENV_IMAGE_SEGMENT_PROVIDER }}
          WORKER_ENV_IMAGE_MODEL_API_KEY: ${{ secrets.WORKER_ENV_IMAGE_MODEL_API_KEY }}
          WORKER_ENV_IMAGE_MODEL_ENDPOINT: ${{ secrets.WORKER_ENV_IMAGE_MODEL_ENDPOINT }}
          WORKER_ENV_IMAGE_GEN_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WORKER_ENV_IMAGE_GEN_CLOUDFLARE_ACCOUNT_ID }}
          WORKER_ENV_IMAGE_GEN_CLOUDFLARE_API_TOKEN: ${{ secrets.WORKER_ENV_IMAGE_GEN_CLOUDFLARE_API_TOKEN }}
          WORKER_ENV_IMAGE_GEN_GEMINI_API_KEY: ${{ secrets.WORKER_ENV_IMAGE_GEN_GEMINI_API_KEY }}
          WORKER_ENV_IMAGE_GEN_MODELS_SCENE: ${{ secrets.WORKER_ENV_IMAGE_GEN_MODELS_SCENE }}
          WORKER_ENV_IMAGE_GEN_MODELS_LISTING: ${{ secrets.WORKER_ENV_IMAGE_GEN_MODELS_LISTING }}
          WORKER_ENV_CREDENTIAL_KEYS: ${{ secrets.WORKER_ENV_CREDENTIAL_KEYS }}
          WORKER_ENV_AMAZON_APP_ID: ${{ secrets.WORKER_ENV_AMAZON_APP_ID }}
          WORKER_ENV_AMAZON_APP_SECRET: ${{ secrets.WORKER_ENV_AMAZON_APP_SECRET }}
          WORKER_ENV_FLIPKART_APP_ID: ${{ secrets.WORKER_ENV_FLIPKART_APP_ID }}
          WORKER_ENV_FLIPKART_APP_SECRET: ${{ secrets.WORKER_ENV_FLIPKART_APP_SECRET }}
          WORKER_ENV_HOME_BRAND_ORG_ID: ${{ secrets.WORKER_ENV_HOME_BRAND_ORG_ID }}
          WORKER_ENV_AMAZON_SOLUTION_ID: ${{ secrets.WORKER_ENV_AMAZON_SOLUTION_ID }}
          WORKER_ENV_CHANNELS_CONNECT: ${{ secrets.WORKER_ENV_CHANNELS_CONNECT }}
          WORKER_ENV_EMAIL_FROM: ${{ secrets.WORKER_ENV_EMAIL_FROM }}
          WORKER_ENV_ENCRYPTION_KEY: ${{ secrets.WORKER_ENV_ENCRYPTION_KEY }}
          WORKER_ENV_NEXTAUTH_SECRET: ${{ secrets.WORKER_ENV_NEXTAUTH_SECRET }}
          WORKER_ENV_NEXTAUTH_URL: ${{ secrets.WORKER_ENV_NEXTAUTH_URL }}
          WORKER_ENV_NEXT_PUBLIC_APP_URL: ${{ secrets.WORKER_ENV_NEXT_PUBLIC_APP_URL }}
          WORKER_ENV_ORG_HANDLE_HOLD_DAYS: ${{ secrets.WORKER_ENV_ORG_HANDLE_HOLD_DAYS }}
          WORKER_ENV_PRISMA_LOG_QUERIES: ${{ secrets.WORKER_ENV_PRISMA_LOG_QUERIES }}
          WORKER_ENV_RAZORPAY_KEY_ID: ${{ secrets.WORKER_ENV_RAZORPAY_KEY_ID }}
          WORKER_ENV_RAZORPAY_KEY_SECRET: ${{ secrets.WORKER_ENV_RAZORPAY_KEY_SECRET }}
          WORKER_ENV_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.WORKER_ENV_RAZORPAY_WEBHOOK_SECRET }}
          WORKER_ENV_RESEND_API_KEY: ${{ secrets.WORKER_ENV_RESEND_API_KEY }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKER_HOST" || { echo "WORKER_HOST is not set; the machine does not exist yet, so there is nothing to start." ; exit 0; }
          # One secret per variable over the optional whole-file base, so changing a value is one edit.
          WORKER_ENV=$(infra/worker/compose-env.sh WORKER_ENV_)
          printf '%s\n' "$WORKER_ENV" | grep -q '^DATABASE_URL=' || { echo "::error::No DATABASE_URL for the worker: set WORKER_ENV_DATABASE_URL (or WORKER_ENV_FILE)."; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$WORKER_SSH_KEY" > ~/.ssh/worker
          chmod 600 ~/.ssh/worker
          SSH="ssh -i ~/.ssh/worker -o StrictHostKeyChecking=accept-new $WORKER_SSH_USER@$WORKER_HOST"
          # The env file and the compose file travel over the same connection; the image
          # reference is fixed to this commit so a rollback is a redeploy of an older SHA.
          printf '%s\n' "$WORKER_ENV" | $SSH 'umask 077 && cat > /opt/worker/.env'
          scp -i ~/.ssh/worker -o StrictHostKeyChecking=accept-new infra/worker/compose.yml "$WORKER_SSH_USER@$WORKER_HOST:/opt/worker/compose.yml"
          $SSH "echo '$GHCR_PULL_TOKEN' | docker login ghcr.io -u '$GHCR_PULL_USER' --password-stdin && \
            cd /opt/worker && \
            WORKER_IMAGE='${IMAGE}:${{ github.sha }}' docker compose pull && \
            WORKER_IMAGE='${IMAGE}:${{ github.sha }}' docker compose up -d --remove-orphans && \
            docker compose ps"
          rm -f ~/.ssh/worker

      - name: Worker summary
        run: |
          {
            echo "### Worker image"
            echo ""
            echo "- Image: \`${{ env.IMAGE }}:${{ github.sha }}\` (also \`:${{ github.ref_name }}\`)"
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "- Production worker restarted on its machine"
            else
              echo "- Not started anywhere: start a staging worker by hand from this tag"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
