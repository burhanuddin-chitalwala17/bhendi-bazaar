name: Load smoke

# The browse path at 3x expected peak (docs/GTM-READINESS.md B12). By hand only, against the preview
# by default: every request is a billed database read, and production is not a test bed.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to load
        required: true
        default: https://dev.bhendi-bazaar.com
      peak_vus:
        description: Concurrent shoppers at the peak (3x the expected peak)
        required: true
        default: "30"
      category_slug:
        description: A category that exists there
        required: true
        default: abayas
      product_slug:
        description: A product that exists there
        required: true
        default: light-blue-rida

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0

      - name: Run the smoke
        uses: grafana/run-k6-action@54385d2a25c222a08b4a3aec6b653b8fb370a1ed # v1.6.0
        env:
          BASE_URL: ${{ inputs.base_url }}
          PEAK_VUS: ${{ inputs.peak_vus }}
          CATEGORY_SLUG: ${{ inputs.category_slug }}
          PRODUCT_SLUG: ${{ inputs.product_slug }}
        with:
          path: perf/k6-smoke.js
          disable-analytics: true
