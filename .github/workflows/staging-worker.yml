name: Staging worker

# Start and stop the worker that serves the dev site, from the Actions tab (worker-foundation
# spec R6). It runs only while somebody is testing, and a tester should not need a terminal.
on:
  workflow_dispatch:
    inputs:
      state:
        description: What the staging worker should be doing
        type: choice
        required: true
        default: up
        options: [up, down]
      hours:
        description: Stop it again after this long. "0" leaves it running until you stop it.
        type: choice
        required: true
        default: "4"
        options: ["2", "4", "8", "12", "0"]

# One at a time: two runs racing would leave the shutdown timer pointing at the wrong container.
concurrency:
  group: staging-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start or stop it on the machine
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          WORKER_SSH_USER: ${{ secrets.WORKER_SSH_USER }}
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          WORKER_ENV_FILE: ${{ secrets.WORKER_ENV_FILE }}
          WORKER_STAGING_ENV_FILE: ${{ secrets.WORKER_STAGING_ENV_FILE }}
          # Named, never `toJSON(secrets)`. Production is needed only for its DATABASE_URL, which
          # the check below compares; every variable the worker reads is listed.
          WORKER_ENV_DATABASE_URL: ${{ secrets.WORKER_ENV_DATABASE_URL }}
          WORKER_STAGING_ENV_DATABASE_URL: ${{ secrets.WORKER_STAGING_ENV_DATABASE_URL }}
          WORKER_STAGING_ENV_APP_ENV: ${{ secrets.WORKER_STAGING_ENV_APP_ENV }}
          WORKER_STAGING_ENV_R2_ENDPOINT: ${{ secrets.WORKER_STAGING_ENV_R2_ENDPOINT }}
          WORKER_STAGING_ENV_R2_BUCKET: ${{ secrets.WORKER_STAGING_ENV_R2_BUCKET }}
          WORKER_STAGING_ENV_R2_ACCESS_KEY_ID: ${{ secrets.WORKER_STAGING_ENV_R2_ACCESS_KEY_ID }}
          WORKER_STAGING_ENV_R2_SECRET_ACCESS_KEY: ${{ secrets.WORKER_STAGING_ENV_R2_SECRET_ACCESS_KEY }}
          WORKER_STAGING_ENV_R2_PUBLIC_BASE_URL: ${{ secrets.WORKER_STAGING_ENV_R2_PUBLIC_BASE_URL }}
          WORKER_STAGING_ENV_IMAGE_SEGMENT_PROVIDER: ${{ secrets.WORKER_STAGING_ENV_IMAGE_SEGMENT_PROVIDER }}
          WORKER_STAGING_ENV_IMAGE_MODEL_API_KEY: ${{ secrets.WORKER_STAGING_ENV_IMAGE_MODEL_API_KEY }}
          WORKER_STAGING_ENV_IMAGE_MODEL_ENDPOINT: ${{ secrets.WORKER_STAGING_ENV_IMAGE_MODEL_ENDPOINT }}
          WORKER_STAGING_ENV_CREDENTIAL_KEYS: ${{ secrets.WORKER_STAGING_ENV_CREDENTIAL_KEYS }}
          WORKER_STAGING_ENV_AMAZON_APP_ID: ${{ secrets.WORKER_STAGING_ENV_AMAZON_APP_ID }}
          WORKER_STAGING_ENV_AMAZON_APP_SECRET: ${{ secrets.WORKER_STAGING_ENV_AMAZON_APP_SECRET }}
          WORKER_STAGING_ENV_FLIPKART_APP_ID: ${{ secrets.WORKER_STAGING_ENV_FLIPKART_APP_ID }}
          WORKER_STAGING_ENV_FLIPKART_APP_SECRET: ${{ secrets.WORKER_STAGING_ENV_FLIPKART_APP_SECRET }}
          WORKER_STAGING_ENV_AMAZON_SOLUTION_ID: ${{ secrets.WORKER_STAGING_ENV_AMAZON_SOLUTION_ID }}
          WORKER_STAGING_ENV_CHANNELS_CONNECT: ${{ secrets.WORKER_STAGING_ENV_CHANNELS_CONNECT }}
          WORKER_STAGING_ENV_EMAIL_FROM: ${{ secrets.WORKER_STAGING_ENV_EMAIL_FROM }}
          WORKER_STAGING_ENV_ENCRYPTION_KEY: ${{ secrets.WORKER_STAGING_ENV_ENCRYPTION_KEY }}
          WORKER_STAGING_ENV_NEXTAUTH_SECRET: ${{ secrets.WORKER_STAGING_ENV_NEXTAUTH_SECRET }}
          WORKER_STAGING_ENV_NEXTAUTH_URL: ${{ secrets.WORKER_STAGING_ENV_NEXTAUTH_URL }}
          WORKER_STAGING_ENV_NEXT_PUBLIC_APP_URL: ${{ secrets.WORKER_STAGING_ENV_NEXT_PUBLIC_APP_URL }}
          WORKER_STAGING_ENV_ORG_HANDLE_HOLD_DAYS: ${{ secrets.WORKER_STAGING_ENV_ORG_HANDLE_HOLD_DAYS }}
          WORKER_STAGING_ENV_PRISMA_LOG_QUERIES: ${{ secrets.WORKER_STAGING_ENV_PRISMA_LOG_QUERIES }}
          WORKER_STAGING_ENV_RAZORPAY_KEY_ID: ${{ secrets.WORKER_STAGING_ENV_RAZORPAY_KEY_ID }}
          WORKER_STAGING_ENV_RAZORPAY_KEY_SECRET: ${{ secrets.WORKER_STAGING_ENV_RAZORPAY_KEY_SECRET }}
          WORKER_STAGING_ENV_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.WORKER_STAGING_ENV_RAZORPAY_WEBHOOK_SECRET }}
          WORKER_STAGING_ENV_RESEND_API_KEY: ${{ secrets.WORKER_STAGING_ENV_RESEND_API_KEY }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/bhendi-bazaar-worker:develop
          STATE: ${{ inputs.state }}
          HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          test -n "$WORKER_HOST" || { echo "::error::WORKER_HOST is not set; there is no machine to reach."; exit 1; }
          # Each file is one secret per variable (WORKER_ENV_<NAME>, WORKER_STAGING_ENV_<NAME>) over an
          # optional whole-file base (infra/worker/compose-env.sh), so a value changes with one edit.
          PROD_ENV=$(BASE_ENV_FILE="$WORKER_ENV_FILE" infra/worker/compose-env.sh WORKER_ENV_)
          STAGING_ENV=$(BASE_ENV_FILE="$WORKER_STAGING_ENV_FILE" infra/worker/compose-env.sh WORKER_STAGING_ENV_)
          printf '%s\n' "$STAGING_ENV" | grep -q '^DATABASE_URL=' || { echo "::error::No staging DATABASE_URL: set WORKER_STAGING_ENV_DATABASE_URL (or WORKER_STAGING_ENV_FILE). It is the dev database, and without it this would have nothing to run against."; exit 1; }

          # The whole risk of a staging worker is which database it names. The two env files
          # differ in exactly that, so a staging file carrying the production string would
          # quietly point a test worker at real orders. Refused here rather than discovered
          # later, and the strings themselves never reach the log.
          reads_database_url() { printf '%s\n' "$1" | grep -m1 '^DATABASE_URL=' | cut -d= -f2- || true; }
          if [ -n "$PROD_ENV" ]; then
            if [ "$(reads_database_url "$STAGING_ENV")" = "$(reads_database_url "$PROD_ENV")" ]; then
              echo "::error::The staging env file names the same database as production. Point it at dev before running this."
              exit 1
            fi
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$WORKER_SSH_KEY" > ~/.ssh/worker
          chmod 600 ~/.ssh/worker
          SSH="ssh -i ~/.ssh/worker -o StrictHostKeyChecking=accept-new $WORKER_SSH_USER@$WORKER_HOST"

          $SSH 'mkdir -p /opt/worker-staging'
          scp -i ~/.ssh/worker -o StrictHostKeyChecking=accept-new infra/worker/compose.yml \
            "$WORKER_SSH_USER@$WORKER_HOST:/opt/worker-staging/compose.yml"

          # Any shutdown left over from an earlier run is cancelled first, so asking again
          # extends the session rather than stacking timers that fight each other.
          $SSH 'cd /opt/worker-staging && { [ -f stop.pid ] && kill "$(cat stop.pid)" 2>/dev/null; true; } && rm -f stop.pid'

          if [ "$STATE" = "down" ]; then
            $SSH 'cd /opt/worker-staging && docker compose -p worker-staging down --remove-orphans && docker compose -p worker-staging ps'
            echo "stopped=true" >> "$GITHUB_ENV"
            exit 0
          fi

          printf '%s\n' "$STAGING_ENV" | $SSH 'umask 077 && cat > /opt/worker-staging/.env'
          $SSH "echo '$GHCR_PULL_TOKEN' | docker login ghcr.io -u '$GHCR_PULL_USER' --password-stdin && \
            cd /opt/worker-staging && \
            WORKER_IMAGE='${IMAGE}' docker compose -p worker-staging pull && \
            WORKER_IMAGE='${IMAGE}' docker compose -p worker-staging up -d --remove-orphans && \
            docker compose -p worker-staging ps"

          # The timer runs on the machine, not here: a job that slept for eight hours would
          # spend eight hours of the Actions allowance doing nothing.
          if [ "$HOURS" != "0" ]; then
            $SSH "cd /opt/worker-staging && nohup sh -c 'sleep $((HOURS * 3600)); cd /opt/worker-staging && docker compose -p worker-staging down --remove-orphans' >/dev/null 2>&1 & echo \$! > /opt/worker-staging/stop.pid"
          fi

          rm -f ~/.ssh/worker

      - name: What happened
        if: always()
        run: |
          {
            echo "### Staging worker"
            echo ""
            if [ "${{ inputs.state }}" = "down" ]; then
              echo "- Stopped. The dev site still works; only video and photo improvement need it."
            else
              echo "- Running against the dev database, from the \`develop\` image."
              if [ "${{ inputs.hours }}" = "0" ]; then
                echo "- **No automatic stop.** Run this again with \`down\` when testing is finished."
              else
                echo "- Stops itself in ${{ inputs.hours }} hours. Run it again to extend."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
