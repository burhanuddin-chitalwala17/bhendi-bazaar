name: Database backup

# Nightly, encrypted, to our own R2 bucket (docs/GTM-READINESS.md B3; runbook: docs/OPERATIONS.md
# "Backups"). Fails red until its secrets exist: a backup job that is green while backing up nothing
# is the failure this replaces. GitHub emails a failed scheduled run to whoever last edited the schedule.
on:
  schedule:
    - cron: "17 20 * * *" # 01:47 IST, the quietest hour
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pg_dump refuses a server newer than itself, so the client comes from the PostgreSQL project
      # at a major at least as new as the database's.
      - name: Install pg_dump 17 and age
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump, encrypt, count and upload
        env:
          # The direct connection string (db.prisma.io, not pooled.): a dump is one long session.
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: bash scripts/backup/db-backup.sh
